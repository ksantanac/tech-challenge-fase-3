# App of Apps: este Application cria os 5 Applications dos microsserviços.
# Aplique UMA vez:  kubectl apply -f gitops/argocd/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ksantanac/tech-challenge-fase-3.git
    targetRevision: HEAD
    path: gitops/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
