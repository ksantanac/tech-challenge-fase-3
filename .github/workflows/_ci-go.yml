name: CI Go (reusável)

# Pipeline de CI + DevSecOps para os microsserviços em Go (auth, evaluation).
on:
  workflow_call:
    inputs:
      service:
        description: "Nome do microsserviço (pasta e repositório ECR)"
        required: true
        type: string

permissions:
  contents: write # necessário para o passo de GitOps (commit da nova tag)

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 885359793851.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ------------------------------------------------------------------ #
  # 1. Build & Unit Test
  # ------------------------------------------------------------------ #
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Resolver dependências
        run: go mod tidy
      - name: Build
        run: go build ./...
      - name: Testes unitários
        run: go test ./...

  # ------------------------------------------------------------------ #
  # 2. Linter / Static Analysis (informativo)
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: go mod tidy
        run: go mod tidy
        working-directory: ${{ inputs.service }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true # advisory: não bloqueia o pipeline
        with:
          working-directory: ${{ inputs.service }}
          args: --timeout=5m

  # ------------------------------------------------------------------ #
  # 3. Security Scan — SCA (bloqueia em CRÍTICO) + SAST (informativo)
  # ------------------------------------------------------------------ #
  security:
    name: Security Scan (SCA + SAST)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      # SCA: vulnerabilidades nas DEPENDÊNCIAS. Bloqueia se achar CRÍTICA.
      - name: Trivy SCA (dependências) — bloqueia em CRÍTICO
        run: trivy fs --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ inputs.service }}

      # SAST: vulnerabilidades no CÓDIGO-FONTE (gosec). Informativo.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gosec (SAST)
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd ${{ inputs.service }} && go mod tidy && gosec ./...

  # ------------------------------------------------------------------ #
  # 4. Docker Build & Push (só na main) — scan da imagem bloqueia em CRÍTICO
  # ------------------------------------------------------------------ #
  docker:
    name: Docker Build, Scan & Push (ECR)
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag (commit hash)
        id: meta
        run: echo "tag=v1.0.0-$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Credenciais AWS (Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem
        run: docker build -t ${{ env.ECR_REGISTRY }}/${{ inputs.service }}:${{ steps.meta.outputs.tag }} ./${{ inputs.service }}

      - name: Instalar Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy — scan da imagem (bloqueia em CRÍTICO)
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ env.ECR_REGISTRY }}/${{ inputs.service }}:${{ steps.meta.outputs.tag }}

      - name: Push para o ECR
        run: docker push ${{ env.ECR_REGISTRY }}/${{ inputs.service }}:${{ steps.meta.outputs.tag }}

  # ------------------------------------------------------------------ #
  # 5. GitOps — atualiza a tag da imagem no repositório (ArgoCD sincroniza)
  # ------------------------------------------------------------------ #
  update-gitops:
    name: GitOps — atualizar tag
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar a tag no deployment.yaml
        run: |
          FILE="gitops/apps/${{ inputs.service }}/deployment.yaml"
          sed -i -E "s|(${{ inputs.service }}):.*|\1:${{ needs.docker.outputs.image_tag }}|" "$FILE"
          echo "Nova imagem:"; grep 'image:' "$FILE"
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/${{ inputs.service }}/deployment.yaml
          git commit -m "gitops(${{ inputs.service }}): deploy ${{ needs.docker.outputs.image_tag }} [skip ci]" || echo "sem mudanças"
          git push
