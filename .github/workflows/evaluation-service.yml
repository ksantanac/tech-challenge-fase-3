name: evaluation-service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evaluation-service/**"
      - ".github/workflows/evaluation-service.yml"
      - ".github/workflows/_ci-go.yml"
  pull_request:
    paths:
      - "evaluation-service/**"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/_ci-go.yml
    with:
      service: evaluation-service
    secrets: inherit
